{% extends 'base.html' %}{% block title %}New Consultation{% endblock %}{% block content %}<div class="narrow"><div class="card"><p class="eyebrow">STUDENT PORTAL</p><h1>Request a Consultation</h1><p class="muted">Provide enough information for the medical expert to review your request.</p><form method="post"><label>Concern / Reason<textarea name="concern" rows="6" required placeholder="Describe your concern...">{{ request.form.get('concern','') }}</textarea></label><div class="form-grid"><label>Preferred Date<input type="date" name="preferred_date" min="{{ now_date if now_date else '' }}" value="{{ request.form.get('preferred_date','') }}" required></label><label>Preferred Time<input type="time" name="preferred_time" value="{{ request.form.get('preferred_time','') }}" required></label></div><div class="actions"><a class="btn btn-light" href="{{ url_for('student.dashboard') }}">Cancel</a><button class="btn" type="submit">Submit Request</button></div></form></div></div>{% endblock %}
